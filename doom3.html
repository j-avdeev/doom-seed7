<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Doom3 Seed7 Playable</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070908;
      --panel: #151918;
      --panel-2: #101413;
      --line: #34413d;
      --text: #edf2ee;
      --muted: #a8b3ad;
      --accent: #77d0bd;
      --accent-2: #caa85f;
      --error: #f08c8c;
      --warn: #d7a05e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 28% 0%, rgba(119, 208, 189, 0.12), transparent 32%),
        linear-gradient(180deg, #0b0e0d 0%, var(--bg) 58%, #040505 100%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(920px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0 22px;
    }

    header {
      display: grid;
      gap: 6px;
      margin-bottom: 18px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 52px);
      line-height: 1;
      font-weight: 760;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0;
      max-width: 760px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
    }

    .panel {
      display: grid;
      gap: 16px;
      background: color-mix(in srgb, var(--panel) 94%, black);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.24);
    }

    .fields {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) minmax(180px, 280px);
      gap: 12px;
      align-items: end;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    input[type="file"],
    input[type="text"] {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel-2);
      color: var(--text);
      padding: 8px 10px;
      font: inherit;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
    }

    button {
      min-height: 40px;
      border: 1px solid #6aa99b;
      border-radius: 6px;
      padding: 0 16px;
      background: var(--accent);
      color: #06110e;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      border-color: var(--line);
      background: #242b29;
      color: var(--text);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .status-line {
      min-height: 22px;
      color: var(--muted);
      font-size: 14px;
    }

    .status-line.error {
      color: var(--error);
    }

    .status-line.warn {
      color: var(--warn);
    }

    details {
      border-top: 1px solid var(--line);
      padding-top: 12px;
    }

    summary {
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
    }

    pre {
      max-height: min(300px, 44vh);
      overflow: auto;
      margin: 10px 0 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #050706;
      color: #d8ebe3;
      padding: 12px;
      font: 12px/1.45 Consolas, "Liberation Mono", monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }

    code {
      color: var(--accent-2);
    }

    @media (max-width: 720px) {
      main {
        width: min(100vw - 20px, 920px);
        padding-top: 18px;
      }

      .fields,
      .actions {
        grid-template-columns: 1fr;
        justify-content: stretch;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main id="launcher">
    <header>
      <h1>Doom3 Seed7</h1>
      <p class="subtitle">
        Playable WebAssembly runtime with generated dark sci-fi assets. Optional local pk4 files are mounted in browser memory only; the game runs without bundled commercial data.
      </p>
    </header>

    <section class="panel" aria-label="Doom3 Seed7 launcher">
      <div class="fields">
        <div>
          <label for="pk4Files">Optional pk4 files</label>
          <input id="pk4Files" type="file" accept=".pk4,.zip" multiple />
        </div>
        <div>
          <label for="startMap">Start map token</label>
          <input id="startMap" type="text" value="game/mars_city1" />
        </div>
      </div>

      <div class="actions">
        <button id="helpButton" class="secondary" type="button">Help</button>
        <button id="runButton" type="button">Launch</button>
      </div>

      <div id="status" class="status-line">Ready. Launch runs <code>doom3_seed7_runtime.s7</code>.</div>

      <details>
        <summary>Runtime log</summary>
        <pre id="log" aria-live="polite"></pre>
      </details>
    </section>
  </main>

  <script>
    (function() {
      var WASM_JS = 'wasm/s7.js';
      var WASM_WASM = 'wasm/s7.wasm';
      var DEFAULT_ENTRY = 'doom3_seed7_runtime.s7';
      var GAME_MODULE = 'doom3_seed7_game.s7';
      var runButton = document.getElementById('runButton');
      var helpButton = document.getElementById('helpButton');
      var pk4Input = document.getElementById('pk4Files');
      var startMapInput = document.getElementById('startMap');
      var statusEl = document.getElementById('status');
      var logEl = document.getElementById('log');
      var hasStarted = false;

      function appendLog(line) {
        if (!logEl) return;
        logEl.textContent += line + '\n';
        logEl.scrollTop = logEl.scrollHeight;
      }

      function setStatus(message, state) {
        statusEl.textContent = message;
        statusEl.className = 'status-line' + (state ? ' ' + state : '');
      }

      function setControls(disabled) {
        runButton.disabled = disabled;
        helpButton.disabled = disabled;
        pk4Input.disabled = disabled;
        startMapInput.disabled = disabled;
      }

      function enforceHttpOnly() {
        if (window.location.protocol !== 'file:') {
          return true;
        }
        setControls(true);
        setStatus('Run over HTTP: python -m http.server 8080, then open http://localhost:8080/doom3.html', 'error');
        appendLog('file:// cannot fetch Seed7 runtime sources or wasm artifacts.');
        return false;
      }

      function canonicalizeEntry(entry) {
        var normalized = (entry || '').trim().toLowerCase();
        if (normalized === DEFAULT_ENTRY || normalized === '/' + DEFAULT_ENTRY) {
          return DEFAULT_ENTRY;
        }
        return DEFAULT_ENTRY;
      }

      function activeEntry() {
        var requested = '';
        try {
          requested = new URL(window.location.href).searchParams.get('entry') || '';
        } catch (error) {
          requested = '';
        }
        return canonicalizeEntry(requested || DEFAULT_ENTRY);
      }

      function normalizeUrlEntry() {
        try {
          var url = new URL(window.location.href);
          if (url.searchParams.get('entry') !== DEFAULT_ENTRY) {
            url.searchParams.set('entry', DEFAULT_ENTRY);
            window.history.replaceState({}, '', url.href);
          }
        } catch (error) {
          // best effort
        }
      }

      function cacheBusted(url) {
        var separator = url.indexOf('?') === -1 ? '?' : '&';
        return url + separator + 's7cache=' + encodeURIComponent(String(Date.now()));
      }

      function sourceCandidates(path) {
        var baseUrl = new URL('.', window.location.href);
        var candidates = [
          new URL(path, baseUrl).href,
          new URL('./' + path, baseUrl).href
        ];
        return candidates.reduce(function(accumulator, candidate) {
          if (accumulator.indexOf(candidate) === -1) accumulator.push(candidate);
          var busted = cacheBusted(candidate);
          if (accumulator.indexOf(busted) === -1) accumulator.push(busted);
          return accumulator;
        }, []);
      }

      function fetchText(path) {
        if (!/\.s7$/i.test(path)) {
          return Promise.reject(new Error('Invalid Seed7 entry rejected: ' + path));
        }
        var candidates = sourceCandidates(path);
        var diagnostics = [];
        function attempt(index) {
          if (index >= candidates.length) {
            return Promise.reject(new Error('Failed to fetch ' + path + '. ' + diagnostics.join(' | ')));
          }
          var candidate = candidates[index];
          return fetch(candidate, { cache: 'no-store' })
            .then(function(response) {
              if (!response.ok) {
                diagnostics.push('HTTP ' + response.status + ' for ' + candidate);
                return attempt(index + 1);
              }
              return response.text();
            }, function(error) {
              diagnostics.push((error && error.message ? error.message : String(error)) + ' for ' + candidate);
              return attempt(index + 1);
            });
        }
        return attempt(0);
      }

      function readFileBytes(file) {
        return new Promise(function(resolve, reject) {
          var reader = new FileReader();
          reader.onload = function() {
            resolve(new Uint8Array(reader.result));
          };
          reader.onerror = function() {
            reject(new Error('Failed to read ' + file.name));
          };
          reader.readAsArrayBuffer(file);
        });
      }

      function cleanPk4Name(fileName, index) {
        var name = fileName.replace(/[^A-Za-z0-9._-]/g, '_');
        if (!/\.(pk4|zip)$/i.test(name)) {
          name = 'pak' + String(index).padStart(3, '0') + '.pk4';
        }
        return name.replace(/\.zip$/i, '.pk4');
      }

      function selectedPk4Files() {
        var files = Array.prototype.slice.call(pk4Input.files || []);
        if (files.length === 0) {
          return Promise.resolve([]);
        }
        setStatus('Mounting ' + files.length + ' asset file(s) in browser memory.');
        return Promise.all(files.map(function(file, index) {
          return readFileBytes(file).then(function(bytes) {
            return { name: cleanPk4Name(file.name, index), bytes: bytes };
          });
        })).then(function(mountedFiles) {
          setStatus('Assets mounted. Starting playable runtime.');
          appendLog('assets mounted: ' + mountedFiles.map(function(item) { return item.name; }).join(', '));
          return mountedFiles;
        });
      }

      function loadScript(src) {
        return new Promise(function(resolve, reject) {
          var script = document.createElement('script');
          script.src = cacheBusted(src);
          script.setAttribute('crossorigin', 'anonymous');
          script.onload = resolve;
          script.onerror = function() {
            reject(new Error('Failed to load ' + src));
          };
          document.body.appendChild(script);
        });
      }

      function startSeed7(args, mountedFiles) {
        if (hasStarted) {
          setStatus('Seed7 runtime already started. Reload the page to run again.', 'warn');
          return Promise.resolve();
        }
        hasStarted = true;
        setControls(true);
        var entry = activeEntry();
        var startMap = startMapInput.value.trim() || 'game/mars_city1';
        var finalArgs = args || [
          '-l', '/seed7/lib',
          '/' + entry,
          '--doom3_data_path', '/doom3',
          '--doom3_start_map', startMap
        ];

        return Promise.all([fetchText(entry), fetchText(GAME_MODULE)]).then(function(sources) {
          window.Module = {
            arguments: finalArgs,
            preRun: [function() {
              function ensureDir(path) {
                try {
                  FS.mkdir(path);
                } catch (error) {
                  if (!error || error.errno !== 20) throw error;
                }
              }
              ensureDir('/doom3');
              ensureDir('/doom3/base');
              FS.writeFile('/' + entry, sources[0]);
              FS.writeFile('/' + GAME_MODULE, sources[1]);
              mountedFiles.forEach(function(item) {
                FS.writeFile('/doom3/base/' + item.name, item.bytes);
              });
            }],
            print: appendLog,
            printErr: appendLog,
            locateFile: function(path) {
              if (path.endsWith('.wasm')) {
                return new URL(WASM_WASM, window.location.href).href;
              }
              return path;
            }
          };
          return loadScript(new URL(WASM_JS, window.location.href).href);
        }).catch(function(error) {
          hasStarted = false;
          setControls(false);
          throw error;
        });
      }

      runButton.addEventListener('click', function() {
        if (!enforceHttpOnly()) return;
        logEl.textContent = '';
        setStatus('Preparing playable Seed7 runtime.');
        selectedPk4Files()
          .then(function(files) {
            setStatus('Launching generated-art game canvas.');
            return startSeed7(null, files);
          })
          .catch(function(error) {
            setStatus('Error: ' + error.message, 'error');
            appendLog(String(error.stack || error));
          });
      });

      helpButton.addEventListener('click', function() {
        if (!enforceHttpOnly()) return;
        logEl.textContent = '';
        setStatus('Starting runtime help.');
        startSeed7(['-l', '/seed7/lib', '/' + activeEntry(), '--help'], [])
          .then(function() {
            setStatus('Help finished. Reload to launch the game.');
          })
          .catch(function(error) {
            setStatus('Error: ' + error.message, 'error');
            appendLog(String(error.stack || error));
          });
      });

      normalizeUrlEntry();
      enforceHttpOnly();
    })();
  </script>
</body>
</html>
