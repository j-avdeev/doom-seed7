name: Deploy playable web demo

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Verify static demo assets
        shell: bash
        run: |
          set -euo pipefail
          test -f web/.nojekyll
          test -f web/index.html
          test -f web/main.js
          test -f web/styles.css
          test -f web/assets/demo_map.pwad
          test -f web/wasm/framebuffer_demo.js
          test -f web/wasm/framebuffer_demo.wasm
          test -f web/wasm/wasm_probe.js
          test -f web/wasm/wasm_probe.wasm
          if find web \( -iname "*.wad" -o -iname "*.pwad" \) ! -path "web/assets/demo_map.pwad" | grep -q .; then
            echo "Unexpected WAD/PWAD file found under web/." >&2
            find web \( -iname "*.wad" -o -iname "*.pwad" \) ! -path "web/assets/demo_map.pwad" >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
