<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seed7 Raycaster (DOOM-lite)</title>
  <style>
    body { margin: 0; background: #111; color: #eee; font-family: sans-serif; }
    #info { padding: 8px; font-size: 14px; }
    #info a { color: #8af; }
    #wrap { display: flex; flex-direction: column; align-items: center; padding: 8px; }
    #canvas-wrap { border: 2px solid #333; }
    .error { color: #f88; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="info">Loading Seed7 raycaster... (fetching <code>raycaster.s7</code> and <code>wasm/s7.js</code>)</div>
    <div id="canvas-wrap"></div>
  </div>

  <script>
    (function() {
      var WASM_DIR = 'wasm';
      var RAYCASTER_URL = 'raycaster.s7';

      function setInfo(msg, isError) {
        var el = document.getElementById('info');
        el.textContent = msg;
        el.className = isError ? 'error' : '';
      }

      function loadScript(src) {
        return new Promise(function(resolve, reject) {
          var s = document.createElement('script');
          s.src = src;
          s.onload = resolve;
          s.onerror = function() { reject(new Error('Failed to load ' + src)); };
          document.body.appendChild(s);
        });
      }

      /* Set Module before s7.js runs so pre_js_browser.js preserves it */
      window.Module = {
        arguments: ['-l', '/seed7/lib', '/raycaster.s7'],
        preRun: [],
        locateFile: function(path) {
          if (path.endsWith('.wasm')) return WASM_DIR + '/s7.wasm';
          return path;
        }
      };

      fetch(RAYCASTER_URL)
        .then(function(r) {
          if (!r.ok) throw new Error(RAYCASTER_URL + ' returned ' + r.status);
          return r.text();
        })
        .then(function(content) {
          window.RAYCASTER_SOURCE = content;
          Module.preRun.push(function() {
            FS.writeFile('/raycaster.s7', RAYCASTER_SOURCE);
          });
          setInfo('Running raycaster... (Arrow keys: move/rotate, ESC: quit)');
          return loadScript(WASM_DIR + '/s7.js');
        })
        .then(function() {
          setInfo('Seed7 raycaster. Arrow keys: move/rotate, ESC: quit.');
        })
        .catch(function(err) {
          setInfo('Error: ' + err.message, true);
          console.error(err);
        });
    })();
  </script>
</body>
</html>
