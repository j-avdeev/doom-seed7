  <h1>Seed7 Doom3</h1>
  <p>Doom3 Seed7 engine-shell WebAssembly runtime is the active path.</p>
  <p><a href="doom3.html?entry=doom3_seed7_runtime.s7">Open Doom3 Seed7 engine shell</a></p>
  <p id="status">Open this page over HTTP (for example: <code>http://localhost:8080/doom3.html</code>).</p>
  <script>
    (function() {
      if (window.location.protocol === 'file:') {
        var status = document.getElementById('status');
        if (status) {
          status.textContent = 'Open via HTTP: python -m http.server 8080 then http://localhost:8080';
        }
      } else {
        var target = new URL('doom3.html', window.location.href);
        target.searchParams.set('entry', 'doom3_seed7_runtime.s7');
        target.searchParams.set('src', Date.now());
        setTimeout(function() {
          window.location.replace(target.href);
        }, 200);
      }
    })();
  </script>
